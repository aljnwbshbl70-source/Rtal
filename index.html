        <!-- تأثيرات إضاءة متوهجة ناعمة خلف الكارت -->
        <div class="absolute -top-28 -left-28 w-56 h-56 bg-pink-500/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-28 -right-28 w-56 h-56 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <!-- شريط التقدم العلوي داخل الكارت -->
        <div class="w-full bg-slate-800/80 h-1.5 rounded-full mb-6 overflow-hidden border border-white/5">

    <script>
        // === التحكم بموسيقى y1.mp3 والمؤثرات ===
        const bgMusic = document.getElementById('love-music');
        let audioCtx = null;
        let isMusicPlaying = false;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleMusic() {
            initAudioContext();
            const btnIcon = document.getElementById('music-icon');
            const statusText = document.getElementById('music-status');

            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                btnIcon.innerText = "🎵";
                statusText.innerText = "الموسيقى متوقفة";
            } else {
                bgMusic.volume = 0.75;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    btnIcon.innerText = "🎶";
                    statusText.innerText = "تذوقي النغمة الآن ✨";
                }).catch(err => console.log("Audio autoplay restriction"));
            }
        }

        // إطلاق أصوات تفاعلية ناعمة عند النقر
        function playSound(type) {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'magic' || type === 'sparkle') {
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        gain.gain.setValueAtTime(0.1, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + 0.25);
                    });
                } else if (type === 'heart') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(330, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.log("Audio waiting for interaction");
            }
        }

        // === إعداد خلفية النجوم والفقاعات ===

        for (let i = 0; i < 75; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', Math.random() * 4 + 2 + 's');
            starsContainer.appendChild(star);
        }

        const particlesContainer = document.getElementById('particles-container');
        const particleIcons = ['🛟', '✨', '💖', '🌊', '👑', '🤍', '⭐', '🎈'];
        
        function spawnParticle() {
            const el = document.createElement('div');
            const isBubble = Math.random() > 0.4;
            
            if (isBubble) {
                el.className = 'floating-bubble';
                const size = Math.random() * 25 + 10;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
            } else {
                el.className = 'floating-heart';
                el.innerHTML = particleIcons[Math.floor(Math.random() * particleIcons.length)];
                el.style.fontSize = Math.random() * 1.2 + 0.9 + 'rem';
            }

            el.style.left = Math.random() * 100 + 'vw';
            const scale = Math.random() * 0.8 + 0.6;
            const duration = Math.random() * 6 + 6; 
            const drift = (Math.random() * 160 - 80) + 'px';
            
            el.style.setProperty('--scale', scale);
            el.style.setProperty('--duration', duration + 's');
            el.style.setProperty('--drift', drift);
            
            particlesContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, duration * 1000);
        }

        }
