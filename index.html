<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة رتال الفاخرة ✨ | رحلة التفوق والإنقاذ 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Amiri:ital,wght@0,700;1,400&display=swap');
        
        :root {
            --bg-main: linear-gradient(135deg, #090D16 0%, #111827 40%, #1F1133 100%);
            --accent-pink: #F472B6;
            --accent-purple: #C084FC;
            --accent-cyan: #38BDF8;
            --accent-gold: #FBBF24;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-main);
            color: #F8FAFC;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.8s ease;
        }

        h1, h2, h3, .font-cairo {
            font-family: 'Cairo', sans-serif;
        }

        .font-amiri {
            font-family: 'Amiri', serif;
        }

        /* توهج النيون والجماليات */
        .neon-text-pink {
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.7), 0 0 24px rgba(244, 114, 182, 0.4);
        }

        .neon-text-gold {
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.7), 0 0 24px rgba(251, 191, 36, 0.4);
        }

        .neon-text-cyan {
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.7), 0 0 24px rgba(56, 189, 248, 0.4);
        }

        /* الأزرار التفاعلية المضيئة */
        .btn-pink {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.25) 0%, rgba(217, 70, 239, 0.3) 100%);
            border: 2px solid rgba(244, 114, 182, 0.5);
            color: #F472B6;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .btn-pink:hover {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.45) 0%, rgba(217, 70, 239, 0.55) 100%);
            border-color: #EC4899;
            color: #ffffff;
            box-shadow: 0 0 32px rgba(244, 114, 182, 0.7);
            transform: scale(1.04) translateY(-2px);
        }

        .btn-pink:active { transform: scale(0.96); }

        .btn-cyan {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25) 0%, rgba(14, 165, 233, 0.3) 100%);
            border: 2px solid rgba(56, 189, 248, 0.5);
            color: #38BDF8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .btn-cyan:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(14, 165, 233, 0.55) 100%);
            border-color: #38BDF8;
            color: #ffffff;
            box-shadow: 0 0 32px rgba(56, 189, 248, 0.7);
            transform: scale(1.04) translateY(-2px);
        }

        .btn-gold {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25) 0%, rgba(245, 158, 11, 0.3) 100%);
            border: 2px solid rgba(251, 191, 36, 0.5);
            color: #FBBF24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.45) 0%, rgba(245, 158, 11, 0.55) 100%);
            border-color: #F59E0B;
            color: #ffffff;
            box-shadow: 0 0 32px rgba(251, 191, 36, 0.7);
            transform: scale(1.04) translateY(-2px);
        }

        .btn-purple {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.25) 0%, rgba(168, 85, 247, 0.3) 100%);
            border: 2px solid rgba(192, 132, 252, 0.5);
            color: #C084FC;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .btn-purple:hover {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.45) 0%, rgba(168, 85, 247, 0.55) 100%);
            border-color: #A855F7;
            color: #ffffff;
            box-shadow: 0 0 32px rgba(192, 132, 252, 0.7);
            transform: scale(1.04) translateY(-2px);
        }

        /* النجوم والجسيمات */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 0.95; transform: scale(1.3); }
        }

        .floating-particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: floatUp var(--duration) linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) rotate(360deg) scale(var(--scale));
                opacity: 0;
            }
        }

        /* انيميشن انتقال الخطوات */
        .step-container {
            animation: slideUpFade 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* كارت زجاجي */
        .glass-card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px 0 rgba(0, 0, 0, 0.65),
                        inset 0 0 35px rgba(244, 114, 182, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* دائرة التنفس */
        .breath-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244,114,182,0.4) 0%, rgba(56,189,248,0.2) 70%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 35px rgba(244, 114, 182, 0.5);
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.85); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.25); box-shadow: 0 0 50px rgba(244, 114, 182, 0.85); }
        }

        /* 3D Flip Cards */
        .card-flip-container {
            perspective: 1000px;
        }
        .card-flip-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-flip-container.flipped .card-flip-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* فقاعات لعبة الضغط */
        .bubble-pop {
            transition: transform 0.15s ease, opacity 0.2s ease;
            cursor: pointer;
        }
        .bubble-pop:active {
            transform: scale(0.8);
        }

        /* عجلة الحظ */
        .wheel-container {
            transition: transform 3.5s cubic-bezier(0.15, 0.99, 0.24, 0.99);
        }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen w-full overflow-hidden">

    <!-- النجوم والجسيمات الخلفية -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none z-0"></div>
    <div id="particles-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- تشغيل ملف الموسيقى الخاص بك y1.mp3 -->
    <audio id="love-music" src="y1.mp3" loop preload="auto"></audio>

    <!-- الهيدر العلوي: التحكم بالموسيقى والثيمات ومؤشر الإنجاز -->
    <header class="fixed top-3 left-3 right-3 md:left-6 md:right-6 z-50 flex items-center justify-between gap-2 bg-slate-900/85 border border-white/10 px-4 py-2.5 rounded-full backdrop-blur-md shadow-2xl">
        <div class="flex items-center gap-2.5">
            <button id="music-btn" onclick="toggleMusic()" class="w-10 h-10 flex items-center justify-center rounded-full bg-pink-500/20 text-pink-300 border border-pink-500/40 hover:scale-110 transition shadow-lg">
                <span id="music-icon" class="text-lg">🎵</span>
            </button>
            <div class="text-xs text-right hidden sm:block">
                <p class="font-bold text-pink-300">أغنية رتال المفضلة (y1.mp3) 🎵</p>
                <p id="music-status" class="text-[10px] text-gray-400">انقري لفتح صوت السكينة والحب</p>
            </div>
        </div>

        <!-- مغير الأجواء البصرية -->
        <div class="flex items-center gap-1.5 bg-white/5 p-1 rounded-full border border-white/10">
            <button onclick="setTheme('cosmos')" title="سماء الفضاء" class="w-5 h-5 rounded-full bg-gradient-to-tr from-purple-900 to-indigo-600 border border-white/30 hover:scale-110 transition"></button>
            <button onclick="setTheme('rose')" title="حديقة الورود" class="w-5 h-5 rounded-full bg-gradient-to-tr from-rose-900 to-pink-500 border border-white/30 hover:scale-110 transition"></button>
            <button onclick="setTheme('gold')" title="الشفق الذهبي" class="w-5 h-5 rounded-full bg-gradient-to-tr from-amber-900 to-yellow-500 border border-white/30 hover:scale-110 transition"></button>
        </div>

        <div class="flex items-center gap-2 bg-pink-950/40 px-3.5 py-1.5 rounded-full border border-pink-500/30 text-xs">
            <span class="text-gray-300 hidden xs:inline">المرحلة:</span>
            <span id="step-counter-text" class="font-extrabold text-pink-400">1 / 44</span>
        </div>
    </header>

    <!-- البطاقة الرئيسية الواسعة -->
    <main class="glass-card max-w-xl w-[92%] md:w-full p-6 md:p-9 rounded-3xl text-center z-10 relative my-10 border border-white/10 shadow-2xl overflow-hidden">
        
        <!-- توهج دافئ في الخلفية -->
        <div class="absolute -top-32 -left-32 w-64 h-64 bg-pink-500/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <!-- شريط التقدم التفاعلي -->
        <div class="w-full bg-slate-800/80 h-2 rounded-full mb-6 overflow-hidden border border-white/5 shadow-inner">
            <div id="progress-bar-fill" class="bg-gradient-to-r from-cyan-400 via-pink-400 to-amber-400 h-full w-[2%] transition-all duration-500 shadow-[0_0_12px_rgba(244,114,182,0.8)]"></div>
        </div>

        <div id="app-viewport" class="step-container space-y-6">
            <!-- سيتم تحميل المحتوى برمجياً هنا -->
        </div>
    </main>

    <script>
        // === التحكم بالصوت والموسيقى والمؤثرات ===
        const bgMusic = document.getElementById('love-music');
        let audioCtx = null;
        let isMusicPlaying = false;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleMusic() {
            initAudioContext();
            const btnIcon = document.getElementById('music-icon');
            const statusText = document.getElementById('music-status');

            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                btnIcon.innerText = "🎵";
                statusText.innerText = "الموسيقى متوقفة";
            } else {
                bgMusic.volume = 0.8;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    btnIcon.innerText = "🎶";
                    statusText.innerText = "أغنيتك تملأ المكان دفئاً ✨";
                }).catch(e => console.log("User gesture needed"));
            }
        }

        function playSound(type) {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(460, now);
                    osc.frequency.exponentialRampToValueAtTime(920, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'magic') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    freqs.forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + i * 0.05);
                        gain.gain.setValueAtTime(0.12, now + i * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.05);
                        osc.stop(now + i * 0.05 + 0.25);
                    });
                } else if (type === 'win') {
                    const chord = [440, 554.37, 659.25, 880];
                    chord.forEach((f) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now);
                        osc.stop(now + 0.8);
                    });
                }
            } catch (e) {}
        }

        // === مغير الثيمات ===
        function setTheme(t) {
            playSound('click');
            if (t === 'cosmos') {
                document.documentElement.style.setProperty('--bg-main', 'linear-gradient(135deg, #090D16 0%, #111827 40%, #1F1133 100%)');
            } else if (t === 'rose') {
                document.documentElement.style.setProperty('--bg-main', 'linear-gradient(135deg, #1C0A19 0%, #2E0F2B 50%, #441228 100%)');
            } else if (t === 'gold') {
                document.documentElement.style.setProperty('--bg-main', 'linear-gradient(135deg, #191206 0%, #2A1D0B 50%, #3D220D 100%)');
            }
        }

        // === النجوم الخلفية والجسيمات ===
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 75; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = Math.random() * 3 + 1 + 'px';
            s.style.height = s.style.width;
            s.style.top = Math.random() * 100 + 'vh';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.setProperty('--duration', Math.random() * 4 + 2 + 's');
            starsContainer.appendChild(s);
        }

        const particlesContainer = document.getElementById('particles-container');
        const particleIcons = ['🛟', '✨', '💖', '👑', '🤍', '⭐', '🎈', '🏆', '🕊️', '🌸', '💫'];
        
        function spawnParticle() {
            const el = document.createElement('div');
            el.className = 'floating-particle';
            el.innerHTML = particleIcons[Math.floor(Math.random() * particleIcons.length)];
            el.style.fontSize = Math.random() * 1.3 + 0.8 + 'rem';
            el.style.left = Math.random() * 100 + 'vw';
            
            const scale = Math.random() * 0.8 + 0.5;
            const duration = Math.random() * 6 + 5.5; 
            const drift = (Math.random() * 160 - 80) + 'px';
            
            el.style.setProperty('--scale', scale);
            el.style.setProperty('--duration', duration + 's');
            el.style.setProperty('--drift', drift);
            
            particlesContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, duration * 1000);
        }
        setInterval(spawnParticle, 400);

        // === متغيرات التطبيق والـ 44 فقرة ===
        let currentStep = 1;
        const totalSteps = 44;
        
        let appData = {
            bubblesPopped: 0,
            starsCaught: 0,
            memoryMatches: 0,
            wheelResult: '',
            chosenSubject: '',
            affirmationCount: 0,
            loveScore: 100
        };

        function goToStep(s) {
            playSound('click');
            if (s === 2 && !isMusicPlaying) toggleMusic();
            currentStep = s;
            renderStep();
        }

        function updateProgress() {
            document.getElementById('step-counter-text').innerText = `${currentStep} / ${totalSteps}`;
            const pct = Math.min(100, Math.round((currentStep / totalSteps) * 100));
            document.getElementById('progress-bar-fill').style.width = pct + '%';
        }

        function renderStep() {
            updateProgress();
            const container = document.getElementById('app-viewport');
            
            container.style.animation = 'none';
            void container.offsetWidth; 
            container.style.animation = 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards';

            let html = '';

            switch(currentStep) {
                // ================= PHASE 1: الإنقاذ والاحتواء العاطفي =================
                case 1:
                    html = `
                        <div class="text-cyan-400 font-bold tracking-widest text-xs uppercase">نداء استغاثة في بحر القدرات 🌊</div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-white leading-relaxed">
                            "أنا غرقت في بحر القدرات.. أحد يسحبني!" 🥺💔
                        </h1>
                        <p class="text-gray-300 text-sm md:text-base leading-relaxed my-4">
                            سمعت نداءك يا أميرة قلبي يا <span class="text-pink-400 font-bold">رتال</span>.. وجيت أركض بمليون طوق نجاة! ما عاش ولا كان من يتركك تغرقين وأنا حيّ! 🛟✨
                        </p>
                        <div class="my-6">
                            <div class="w-24 h-24 mx-auto flex items-center justify-center bg-pink-500/20 rounded-full border-2 border-pink-400 animate-bounce shadow-[0_0_25px_rgba(244,114,182,0.5)]">
                                <span class="text-5xl">🛟</span>
                            </div>
                        </div>
                        <div class="flex justify-center mt-6">
                            <button onclick="goToStep(2); playSound('magic');" class="btn-pink font-extrabold text-base md:text-lg py-3.5 px-8 rounded-full">
                                🤝 امسكي يدي الحين.. وببدأ أسحبك!
                            </button>
                        </div>
                    `;
                    break;

                case 2:
                    html = `
                        <div class="text-pink-400 font-bold tracking-widest text-xs uppercase">المرحلة 2 | طوق النجاة الأول 🤍</div>
                        <h2 class="text-2xl font-bold text-pink-300">سحبتك للأمان خلاص.. خذي نفس عميق 🕊️</h2>
                        <p class="text-gray-200 text-xs md:text-sm my-3">
                            تم تشغيل أغنية السكينة الخاصة بك <span class="text-pink-400 font-bold">(y1.mp3)</span> 🎵
                        </p>
                        <div class="flex flex-col items-center justify-center my-6">
                            <div class="breath-ring flex items-center justify-center text-white font-bold text-sm text-center px-4">
                                <span>شهـيق.. 🌬️<br><span class="text-xs font-normal text-pink-200">ثم زفيـر.. 🌸</span></span>
                            </div>
                            <p class="text-xs text-gray-400 mt-4">لاحظي الدائرة وتعدلي بجلستك وتنفسي بروقان ✨</p>
                        </div>
                        <div class="flex justify-center mt-6">
                            <button onclick="goToStep(3)" class="btn-cyan font-bold text-base py-3 px-8 rounded-full">
                                👉 هديت شوي.. كمل حنانك 🥺
                            </button>
                        </div>
                    `;
                    break;

                case 3:
                    html = `
                        <div class="text-purple-400 font-bold tracking-widest text-xs uppercase">المرحلة 3 | الحقيقة الصادقة 💎</div>
                        <h2 class="text-xl md:text-2xl font-bold text-white mb-4">تدرين ليه كلمة "غرقت" ما تليق عليك يا رتال؟</h2>
                        <div class="space-y-3 text-right text-xs md:text-sm text-gray-200 bg-white/5 p-5 rounded-2xl border border-white/10">
                            <p>💎 لأن عيونك وعقلك أصلاً أعمق من كل اختبارات الدنيا.</p>
                            <p>💎 لأن التعب اللي حاسّة فيه الحين دليل إنك شخص يسعى ويحاول بجدية.</p>
                            <p>💎 ولأن معك شخص مستعد يحارب العالم بس عشان ابتسامتك!</p>
                        </div>
                        <div class="flex justify-center mt-6">
                            <button onclick="goToStep(4)" class="btn-pink font-bold py-3 px-8 rounded-full">
                                👉 بعد يا قلبي؟ 🥹
                            </button>
                        </div>
                    `;
                    break;

                case 4:
                    html = `

        // === منطق الألعاب التفاعلية داخل المراحل ===
        function popBubble(id) {
            playSound('pop');
            const b = document.getElementById(`bubble-${id}`);
            if (b && !b.classList.contains('popped')) {
                b.classList.add('popped');
                b.style.opacity = '0.2';
                b.style.transform = 'scale(0.5)';
                appData.bubblesPopped++;
                const countEl = document.getElementById('pop-count');
                if (countEl) countEl.innerText = appData.bubblesPopped;

                if (appData.bubblesPopped >= 6) {
                    const btn = document.getElementById('pop-next-btn');
                    if (btn) btn.classList.remove('hidden');
                }
            }
        }

        function catchStar() {
            playSound('pop');
            appData.starsCaught++;
            const countEl = document.getElementById('star-count');
            if (countEl) countEl.innerText = appData.starsCaught;

            const starEl = document.getElementById('clickable-star');
            if (starEl) {
                starEl.style.top = Math.random() * 60 + 10 + '%';
                starEl.style.left = Math.random() * 70 + 10 + '%';
            }

            if (appData.starsCaught >= 5) {
                const btn = document.getElementById('star-next-btn');
                if (btn) btn.classList.remove('hidden');
            }
        }

        let firstMemCard = null;
        function flipMemCard(el, icon) {
            if (el.innerText !== '❓') return;
            playSound('click');
            el.innerText = icon;

            if (!firstMemCard) {
                firstMemCard = { el, icon };
            } else {
                if (firstMemCard.icon === icon) {
                    playSound('magic');
                    appData.memoryMatches++;
                    firstMemCard = null;
                    const countEl = document.getElementById('mem-count');
                    if (countEl) countEl.innerText = appData.memoryMatches;

                    if (appData.memoryMatches >= 2) {
                        const btn = document.getElementById('mem-next-btn');
                        if (btn) btn.classList.remove('hidden');
                    }
                } else {
                    setTimeout(() => {
                        el.innerText = '❓';
                        if (firstMemCard) firstMemCard.el.innerText = '❓';
                        firstMemCard = null;
                    }, 500);
                }
            }
        }

        function spinWheel() {
            playSound('magic');
            const wheel = document.getElementById('spin-wheel');
            if (wheel) {
                wheel.style.transform = `rotate(${1440 + Math.random() * 360}deg)`;
                setTimeout(() => {
                    playSound('win');
                    const btn = document.getElementById('wheel-next-btn');
                    if (btn) btn.classList.remove('hidden');
                }, 3500);
            }
        }

        const affirmations = [
            "أنا رتال.. عقلي يستوعب كل المعلومات بهدوء وذكاء ✨",
            "اختبار القدرات خطوة بسيطة في طريقي للنجاح الكبير 👑",
            "أنا قوية، ملهمة، وتستحق نتيجتي الـ 100% 🌸",
            "مع كل سؤال أحله بثقة، أقترب أكثر من حلمي التام 💎"
        ];
        function generateAffirmation() {
            playSound('magic');
            appData.affirmationCount++;
            const textEl = document.getElementById('aff-text');
            if (textEl) {
                textEl.innerText = affirmations[appData.affirmationCount % affirmations.length];
            }
            const btn = document.getElementById('aff-next-btn');
            if (btn) btn.classList.remove('hidden');
        }

        function restartApp() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            isMusicPlaying = false;
            document.getElementById('music-icon').innerText = "🎵";
            document.getElementById('music-status').innerText = "انقري لتشغيل الأغنية";
            currentStep = 1;
            appData.bubblesPopped = 0;
            appData.starsCaught = 0;
            appData.memoryMatches = 0;
            renderStep();
        }

        window.onload = function() {
            renderStep();
        };
    </script>
</body>
</html>
